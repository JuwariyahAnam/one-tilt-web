AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: One-Tilt Web backend - API Gateway + Lambda + Bedrock + DynamoDB + SNS (+ ElevenLabs)

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared key the Chrome extension sends in the x-api-key header (16+ characters).
  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: ElevenLabs API key (text to speech, Scribe, voice cloning). Leave empty to skip.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Any Bedrock model that supports the Converse API with tool use (enable it in the Bedrock console first).
  AlertPhone:
    Type: String
    Default: ''
    Description: Optional family phone number for help alerts, in E.164 format (e.g. +919876543210).

Conditions:
  HasPhone: !Not [!Equals [!Ref AlertPhone, '']]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 25

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type, x-api-key]
        AllowMethods: [GET, POST, PUT, OPTIONS]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  OneTiltFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Description: One-Tilt Web API
      Environment:
        Variables:
          API_KEY: !Ref ApiKey
          ELEVENLABS_API_KEY: !Ref ElevenLabsApiKey
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          SETTINGS_TABLE: !Ref SettingsTable
          HELP_TOPIC_ARN: !Ref HelpTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt HelpTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: '*'
      Events:
        All:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  HelpTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: OneTilt

  FamilyPhone:
    Type: AWS::SNS::Subscription
    Condition: HasPhone
    Properties:
      TopicArn: !Ref HelpTopic
      Protocol: sms
      Endpoint: !Ref AlertPhone

Outputs:
  ApiUrl:
    Description: Paste this into the One-Tilt side panel (AI backend -> API URL)
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  HelpTopicArn:
    Description: Add more family phones or emails as subscribers to this topic
    Value: !Ref HelpTopic
